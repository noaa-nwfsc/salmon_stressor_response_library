name: Run R Unit Tests and Check Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-22.04

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      _R_CHECK_FORCE_SUGGESTS_: false
      CI: true
      RENV_CONFIG_SYNCHRONIZED_CHECK: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Linux System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libsqlite3-dev \
            pandoc \
            cmake \
            libx11-dev \
            libxt-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true

      - name: Restore renv Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Install Missing Test Dependencies into renv
        shell: Rscript {0}
        run: |
          # Install test packages into the active renv library if not present
          pkgs <- c("testthat", "covr", "RSQLite")
          for (p in pkgs) {
            if (!requireNamespace(p, quietly = TRUE)) {
              install.packages(p, repos = "https://packagemanager.posit.co/cran/__linux__/jammy/latest")
            }
          }

      - name: Run testthat Unit Tests
        shell: Rscript {0}
        run: |
          library(testthat)
          results <- testthat::test_dir("tests/testthat", reporter = "progress", stop_on_failure = TRUE)

      - name: Calculate Code Coverage
        if: success()
        shell: Rscript {0}
        run: |
          library(covr)
          target_files <- list.files("modules", pattern = "\\.R$", full.names = TRUE)
          test_files <- list.files("tests/testthat", pattern = "^test.*\\.R$", full.names = TRUE)

          coverage <- covr::file_coverage(
            source_files = target_files,
            test_files = test_files
          )

          print(coverage)
          cat(sprintf("\nTotal Application Coverage: %.2f%%\n", covr::percent_coverage(coverage)))
